# GRUB configuration reference file

#############
#  fs       #
#############
# part fmt
insmod part_gpt
insmod part_msdos

# fs driver
insmod fat
insmod exfat
insmod ext2
insmod ntfs
insmod btrfs
insmod iso9660
insmod jfs
insmod reiserfs
insmod udf
insmod xfs
insmod zfs



################
#   user var   #
################
set linux_option_normal="quiet splash loglevel=0"

set themename="miku-grub"
set themefont="miku-hack-13.pf2"
set color_font="miku-hack-13.pf2"



################
#     esp      #
################
probe -u $root --set=esp_uuid
search --no-floppy --fs-uuid --set=esp ${esp_uuid}



############
# load env #
############
if [ -s $prefix/grubenv ]; then
  load_env
fi

if [ "${env_block}" ] ; then
  set env_block="(${root})${env_block}"
  export env_block
  load_env -f "${env_block}"
fi



#############
# video env #
#############
function load_video{
	if [ x$feature_all_video_module = xy ]; then
		insmod all_video
	else
		insmod efi_gop
		insmod efi_uga
		insmod ieee1275_fb
		insmod vbe
		insmod vga
		insmod video_bochs
		insmod video_cirrus
	fi

	set color_normal=cyan/black
	set color_highlight=cyan/white
	set menu_color_normal=cyan/black
	set menu_color_highlight=cyan/white
}

load_video
insmod jpeg
insmod png



###########
#  locale #
###########
set locale_dir=$prefix/locale
set lang=en_US



#############
#  default  #
#############

#menu item 0
set default=0

if [ x$feature_default_font_path = xy ] ; then
	loadfont unicode
else
	loadfont ($esp)/grub/fonts/unicode.pf2
fi



###############
# terminal io #
###############
insmod gfxterm
insmod gfxmenu
insmod gfxterm_background

set gfxmode=640x480,800x600,1024x768,1280x720,1366x768,1440x900,1400x1050,1680x1050,1920x1080,auto
#set gfxpayload=keep
terminal_input console
terminal_output gfxterm
#terminal_output console



##########
# themes #
##########
loadfont ($esp)/grub/themes/${themename}/${themefont}
set theme=($esp)/grub/themes/${themename}/theme.txt
export theme

# ffmpeg -i bg.jpeg -s 1920x1080 -pix_fmt yuvj420p background.jpeg
background_image -m stretch ($esp)/grub/themes/${themename}/background.jpeg



#############
#  timeout  #
#############
if [ x$feature_timeout_style = xy ] ; then
  set timeout_style=menu
  set timeout=2
else
  set timeout=2
fi

keystatus --shift



##############
#  menuentry #
##############
if [ x"${feature_menuentry_id}" = xy ];then
	menuentry_id_option="--id"
else
	menuentry_id_option=""
fi

export menuentry_id_option

menuentry '[===      ArchLinux     ===]' \
	--hotkey=' ' \
	--class arch \
	--class gnu-linux \
	--class gnu \
	--class os \
	$menuentry_id_option 'archlinux'{

	load_video
	
	insmod gzio

	set root=${esp}

	set arch_iso=/iso/archlinux-x86_64.iso
	loopback loop (${root})${arch_iso}

	set linux_img_path=(loop)/arch/boot/x86_64


	echo '                     linux ...                                   '
	linux ${linux_img_path}/vmlinuz-linux img_dev=/dev/disk/by-uuid/${esp_uuid} img_loop=${arch_iso} archisobasedir=arch

	echo '                     initrd ...                                  '
	initrd ${linux_img_path}/initramfs-linux.img

	echo '                     Archlinux ...                               '
	echo '                                                                 '
	echo '                            -`                                   '
	echo '                           .o+`                                  '
	echo '                          `ooo/                                  '
	echo '                         `+oooo:                                 '
	echo '                        `+oooooo:                                '
	echo '                        -+oooooo+:                               '
	echo '                      `/:-:++oooo+:                              '
	echo '                     `/++++/+++++++:                             '
	echo '                    `/++++++++++++++:                            '
	echo '                   `/+++ooooooooooooo/`                          '
	echo '                  ./ooosssso++osssssso+`                         '
	echo '                 .oossssso-````/ossssss+`                        '
	echo '                -osssssso.      :ssssssso.                       '
	echo '               :osssssss/        osssso+++.                      '
	echo '              /ossssssss/        +ssssooo/-                      '
	echo '            `/ossssso+/:-        -:/+osssso+-                    '
	echo '           `+sso+:-`                 `.-/+oso:                   '
	echo '          `++:.                           `-/+/                  '
	echo '          .`                                 `/                  '
	echo '                        condexpr01                               '

}



if fwsetup --is-supported; then
	menuentry '[===    UEFI / BIOS     ===]' \
	--hotkey="'" \
	--class efi \
	$menuentry_id_option 'uefi-firmware' {
		fwsetup
	}
fi

